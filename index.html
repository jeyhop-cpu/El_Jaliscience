<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tablero El Jalisciense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: banda negra de marca (como la playera) + navegación tipo listón verde; contenido en hojas claras de 1080px que se apilan en teléfono.
   Un solo tema deliberado: papel claro con bandas negras, colores de la marca (negro, verde bosque, blanco). */
:root {
  color-scheme: light;
  --paper: #F1F3EF; --sheet: #FFFFFF; --sheet-2: #E8ECE6; --ink: #141A15; --ink-2: #48534A; --ink-3: #7A857C; --line: #D5DCD3;
  --black: #0D0F0E; --black-2: #1A1D1B; --cream: #F2F0EA; --cream-2: #B9BDB6;
  --green: #1F5C38; --green-2: #2A7A4B; --green-soft: #DCEBDF; --amber: #B07A12; --amber-soft: #F6E9CC; --chile: #A9362A; --chile-soft: #F5DEDA;
  --f: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f); font-size: 15.5px; line-height: 1.5; font-variation-settings: "wdth" 100; }
a { color: var(--green); }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; }
/* banda negra */
.hero { background: var(--black); color: var(--cream); background-image: radial-gradient(ellipse at 18% 40%, #1d2a21 0%, rgba(13,15,14,0) 55%), repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 5px); }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 8px 32px; align-items: center; padding-block: 18px 26px; }
.logo { width: 100%; max-width: 420px; aspect-ratio: 744 / 544; background: center / cover no-repeat; -webkit-mask-image: radial-gradient(ellipse 62% 60% at 50% 52%, #000 55%, transparent 100%); mask-image: radial-gradient(ellipse 62% 60% at 50% 52%, #000 55%, transparent 100%); }
.hero h1 { margin: 0; font-weight: 850; font-size: clamp(25px, 4.3vw, 40px); line-height: 1.05; letter-spacing: -0.01em; font-variation-settings: "wdth" 112; text-wrap: balance; }
.hero h1 em { font-style: normal; color: #7FCB97; }
.hero .lead { color: var(--cream-2); margin: 10px 0 0; max-width: 46ch; }
.hero .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 5px 10px; border-radius: 3px; border: 1px solid rgba(242,240,234,.25); color: var(--cream); white-space: nowrap; }
.chip.g { background: var(--green); border-color: transparent; }
.mini { background: var(--black); color: var(--cream); }
.mini .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.mini b { font-weight: 850; letter-spacing: .02em; text-transform: uppercase; font-variation-settings: "wdth" 118; }
.mini span { color: var(--cream-2); font-size: 13px; }
/* navegación tipo listón */
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--black-2); border-top: 1px solid #2b302c; }
nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-block: 8px; }
nav.tabs .wrap::-webkit-scrollbar { display: none; }
nav.tabs button { flex: none; font: 750 12.5px var(--f); letter-spacing: .06em; text-transform: uppercase; font-variation-settings: "wdth" 110; color: var(--cream-2); background: none; border: 0; padding: 8px 12px; border-radius: 3px; cursor: pointer; }
nav.tabs button:hover { color: var(--cream); }
nav.tabs button[aria-selected="true"] { background: var(--green); color: #fff; outline: 1.5px solid rgba(255,255,255,.85); outline-offset: -4px; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, summary:focus-visible { outline: 2.5px solid #2E7BD6 !important; outline-offset: 2px !important; }
main.wrap { display: grid; gap: 22px; padding-block: 24px 56px; }
/* encabezado de sección: listón como el del logo */
.sec { display: grid; gap: 6px; }
.banner { display: inline-block; justify-self: start; background: var(--green); color: #fff; padding: 9px 16px 8px; outline: 2px solid #fff; outline-offset: -6px; box-shadow: 0 0 0 1px var(--green); }
.banner h2 { margin: 0; font-weight: 850; font-size: clamp(18px, 3vw, 24px); letter-spacing: .01em; text-transform: uppercase; font-variation-settings: "wdth" 116; line-height: 1.1; }
.kicker { display: flex; align-items: center; gap: 10px; color: var(--green); font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; margin: 2px 0 0; }
.kicker::before, .kicker::after { content: ""; height: 2px; background: var(--green); width: 28px; flex: none; }
.intro { color: var(--ink-2); max-width: 70ch; margin: 2px 0 0; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: 18px; min-width: 0; }
.card h3 { margin: 0 0 4px; font-size: 17px; font-weight: 800; font-variation-settings: "wdth" 105; text-wrap: balance; }
.card .sub { color: var(--ink-2); font-size: 13.5px; margin: 0 0 12px; }
.stitch { outline: 1.5px dashed rgba(31,92,56,.45); outline-offset: -8px; }
.dark { background: var(--black); color: var(--cream); border-color: var(--black); }
.dark .sub, .dark .lbl { color: var(--cream-2); }
.dark.stitch { outline-color: rgba(127,203,151,.5); }
.lbl { font-size: 12px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 4px; font-variation-settings: "wdth" 108; }
.num { font-variant-numeric: tabular-nums; }
.big { font-weight: 850; font-size: clamp(28px, 5vw, 40px); line-height: 1.02; letter-spacing: -0.015em; font-variation-settings: "wdth" 112; font-variant-numeric: tabular-nums; }
.big small { font-size: 15px; font-weight: 600; color: var(--ink-3); letter-spacing: 0; }
.dark .big small { color: var(--cream-2); }
.mid { font-weight: 800; font-size: 24px; font-variation-settings: "wdth" 108; font-variant-numeric: tabular-nums; line-height: 1.1; }
.note { font-size: 13.5px; color: var(--ink-2); margin-top: 6px; }
.dark .note { color: var(--cream-2); }
.green { color: var(--green-2); } .amber { color: var(--amber); } .chile { color: var(--chile); }
.dark .green { color: #7FCB97; }
.bar { height: 10px; background: var(--sheet-2); border-radius: 2px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--green-2); }
.dark .bar { background: #2a2f2b; }
.chart { position: relative; height: 300px; }
.chart.s { height: 250px; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 750; padding: 8px; border-bottom: 2px solid var(--ink); white-space: nowrap; }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.tot td { font-weight: 800; border-top: 2px solid var(--ink); border-bottom: 0; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 750; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 2px; white-space: nowrap; }
.p-ok { background: var(--green-soft); color: var(--green); } .p-cred { background: var(--amber-soft); color: #7A5408; } .p-pend { background: var(--chile-soft); color: var(--chile); } .p-neu { background: var(--sheet-2); color: var(--ink-2); }
.empty { border: 1.5px dashed var(--line); border-radius: 6px; padding: 22px; text-align: center; color: var(--ink-2); }
.empty b { display: block; color: var(--ink); margin-bottom: 4px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button { font: 700 13px var(--f); letter-spacing: .03em; padding: 7px 12px; border-radius: 3px; border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
input, select { font: 15px var(--f); color: var(--ink); background: var(--sheet); border: 1.5px solid var(--line); border-radius: 4px; padding: 9px 10px; width: 100%; min-width: 0; font-variant-numeric: tabular-nums; }
input[type="range"] { padding: 0; border: 0; accent-color: var(--green-2); background: none; }
input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--green-2); padding: 0; flex: none; }
.fld { display: grid; gap: 4px; min-width: 0; }
.fld label { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
form.f { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); align-items: end; }
.wide { grid-column: 1 / -1; }
.btn { font: 800 13.5px var(--f); letter-spacing: .05em; text-transform: uppercase; border-radius: 3px; padding: 11px 16px; border: 0; background: var(--green); color: #fff; cursor: pointer; }
.btn.sec { background: var(--sheet-2); color: var(--ink); }
.btn.sm { padding: 7px 10px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.msg { font-size: 13px; color: var(--ink-2); } .msg.ok { color: var(--green-2); font-weight: 700; } .msg.err { color: var(--chile); font-weight: 700; }
.split { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; }
.split .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.split .t { font-weight: 850; border-top: 2px solid currentColor; padding-top: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); margin-top: 10px; }
.legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; border-radius: 2px; }
/* checklist de surtido */
.chk { display: grid; gap: 0; }
.chk label.it { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 11px 2px; border-bottom: 1px dashed var(--line); cursor: pointer; }
.chk label.it:last-child { border-bottom: 0; }
.chk .nm { font-weight: 700; }
.chk .ds { font-size: 13px; color: var(--ink-2); grid-column: 2; }
.chk .pr { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chk .pr small { display: block; font-weight: 500; color: var(--ink-3); font-size: 12px; }
.chk input:checked ~ .nm { text-decoration: line-through; color: var(--ink-3); }
.grp-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding-bottom: 10px; border-bottom: 2px solid var(--ink); margin-bottom: 4px; }
.grp-h h3 { margin: 0; text-transform: uppercase; letter-spacing: .03em; font-variation-settings: "wdth" 112; }
.grp-h .mid { font-size: 20px; }
/* precios por poner */
.pp { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.pp:last-child { border-bottom: 0; }
.pp .t { font-weight: 750; }
.pp .d { font-size: 13px; color: var(--ink-2); }
.pp .val { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pp form { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.pp form input { width: 140px; }
.incl { columns: 2 220px; margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; }
.incl li { break-inside: avoid; margin-bottom: 2px; }
.mbar { display: grid; grid-template-columns: minmax(120px, 1.1fr) minmax(0, 3fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.mbar .track { display: flex; height: 22px; gap: 2px; }
.mbar .track span { display: block; height: 100%; }
.mbar .nm { font-weight: 700; font-size: 14px; }
.mbar .nm small { display: block; font-weight: 500; color: var(--ink-3); font-size: 12px; }
.mbar .pc { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; min-width: 64px; }
details > summary { cursor: pointer; font-weight: 750; color: var(--green); list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "＋ "; }
details[open] > summary::before { content: "－ "; }
.foot { color: var(--ink-3); font-size: 12.5px; }
.masonry { columns: 2 340px; column-gap: 14px; }
.masonry > .card { break-inside: avoid; margin-bottom: 14px; display: block; }
footer.site { background: var(--black); color: var(--cream-2); font-size: 13px; }
footer.site .wrap { padding-block: 18px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
@media (max-width: 720px) {
  .hero .wrap { grid-template-columns: 1fr; padding-block: 8px 22px; }
  .logo { max-width: 300px; margin: 0 auto; }
  .mbar { grid-template-columns: minmax(0, 1fr) auto; }
  .mbar .track { grid-column: 1 / -1; grid-row: 2; }
  .hide-sm { display: none; }
  .chart { height: 260px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<style>
/* ajustes de la versión simple */
@media (min-width: 721px) { .hero .wrap { grid-template-columns: minmax(0, 0.75fr) minmax(0, 1.25fr); } }
@media (max-width: 720px) { .hero .sum { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; gap: 6px !important; } .hero .sum > div { padding: 8px !important; } .hero .sum .v { font-size: 18px !important; } .hero .sum .l { font-size: 10px !important; letter-spacing: .05em !important; } .mini span { display: none; } }
.hero h1 { font-size: clamp(24px, 3.9vw, 38px); }
.statement b { color: #7FCB97; }
.hero .sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
.hero .sum > div { border: 1.5px dashed rgba(127,203,151,.45); padding: 10px 12px; border-radius: 3px; }
.hero .sum .l { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--cream-2); font-weight: 700; }
.hero .sum .v { font-size: 26px; font-weight: 850; font-variation-settings: "wdth" 112; font-variant-numeric: tabular-nums; line-height: 1.1; }
.health { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
.dot { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 24px; color: #fff; }
.dot.ok { background: var(--green-2); } .dot.mid { background: var(--amber); } .dot.bad { background: var(--chile); } .dot.wait { background: var(--ink-3); }
.costs { display: grid; gap: 10px; }
.costrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; }
.costrow .t { font-weight: 700; } .costrow .v { font-weight: 800; font-variant-numeric: tabular-nums; }
.costrow .bar { grid-column: 1 / -1; height: 12px; }
.costrow .d { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-3); margin-top: -2px; }
.equals { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; border-top: 3px solid var(--ink); margin-top: 6px; padding-top: 10px; }
.equals .t { font-weight: 850; font-size: 17px; } .equals .v { font-weight: 900; font-size: 22px; font-variant-numeric: tabular-nums; }
.inv-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.inv-item .t { font-weight: 700; } .inv-item .d { font-size: 13px; color: var(--ink-2); } .inv-item .v { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.todo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; padding: 13px 0; border-bottom: 1px solid var(--line); align-items: start; }
.todo input[type=checkbox] { margin-top: 2px; width: 22px; height: 22px; }
.todo .t { font-weight: 700; } .todo .d { font-size: 13px; color: var(--ink-2); }
.todo.done .t { text-decoration: line-through; color: var(--ink-3); }
.todo .amt { text-align: right; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
.todo form { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.todo form input { width: 150px; }
.bigform { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); align-items: end; }
.bigform input { font-size: 22px; padding: 12px 14px; font-weight: 700; }
.bigform label { font-size: 14px; font-weight: 800; color: var(--ink); }
.bigform .hint { font-size: 12.5px; color: var(--ink-3); }
[hidden] { display: none !important; }
.pinbox { position: fixed; inset: 0; background: rgba(13,15,14,.55); display: grid; place-items: center; z-index: 50; padding: 16px; }
.pincard { background: var(--sheet); border-radius: 6px; padding: 22px; width: min(360px, 100%); outline: 1.5px dashed rgba(31,92,56,.45); outline-offset: -8px; }
.pincard h3 { margin: 0 0 4px; font-size: 19px; }
.pincard input { font-size: 24px; letter-spacing: .3em; text-align: center; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--black); color: var(--cream); padding: 10px 16px; border-radius: 4px; z-index: 60; font-weight: 700; max-width: calc(100% - 32px); }
details.gx > summary { list-style: none; cursor: pointer; padding: 4px 0; }
details.gx > summary::before { content: none; }
details.gx > summary::-webkit-details-marker { display: none; }
details.gx .more { font-size: 11.5px; font-weight: 700; color: var(--green); letter-spacing: .04em; text-transform: uppercase; margin-left: 6px; white-space: nowrap; }
details.gx .more::before { content: "▸ "; }
details.gx[open] .more::before { content: "▾ "; }
details.gx[open] .more { color: var(--ink-3); }
.det { overflow-x: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; margin: 8px 0 6px; }
.det table { font-size: 13.5px; }
.efs { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 6px; }
.ef span { white-space: nowrap; }
.ef { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); font-weight: 600; }
.ef input { width: 96px; padding: 5px 7px; font-size: 14px; font-weight: 700; }
.ef input:disabled { background: transparent; border-style: dashed; color: var(--ink-2); }
.show-sm { display: none; }
@media (max-width: 720px) { .show-sm { display: block; } .ef span { white-space: normal; } .ef input { width: 80px; } .det { padding: 8px; } }
.reg td:first-child { white-space: nowrap; }
.tabs-simple button { font-size: 13.5px !important; padding: 10px 16px !important; }
</style>

<style>
/* Tema "pueblito en la bruma": casitas pastel con techos de teja sobre agua tranquila.
   Bruma verde-agua de fondo, paredes de yeso cálido, tejas terracota, pilotes grafito. Un solo tema claro, deliberado. */
:root {
  color-scheme: light;
  --paper: #EEF2EE; --sheet: #FFFBF4; --sheet-2: #F4EBDD; --ink: #2B3837; --ink-2: #52605E; --ink-3: #85908C; --line: #EADFD0;
  --black: #34403F; --black-2: #3D4A49; --cream: #FFF8EE; --cream-2: #E4EEEB;
  --green: #C95D31; --green-2: #4A7BC8; --green-soft: #E2EBF8;
  --amber: #C98A1E; --amber-soft: #FBEED2; --chile: #C2453A; --chile-soft: #F8DED8;
  --teja: #D0663A; --teja-d: #A8461F; --lima: #CFE08A; --rosa: #E9A4BD; --cielo: #8FB5EA; --maiz: #F2D77C; --mar: #5E8E8A; --bruma: #A9CBC6;
  --leaf: #4F8A35;
  --f: "Nunito", "Segoe UI", system-ui, sans-serif;
  --fd: "Fredoka", "Nunito", "Segoe UI", system-ui, sans-serif;
  --r: 18px;
}
body { font-family: var(--f); background: var(--paper); background-image: linear-gradient(180deg, #B5D2CD 0px, #D5E5E0 340px, var(--paper) 900px); background-repeat: no-repeat; color: var(--ink); font-variation-settings: normal; }
h1, h2, h3, .big, .mid, .banner h2, .hero .sum .v, nav.tabs button, .btn, .grp-h h3, .equals .v, .costrow .v { font-family: var(--fd) !important; font-variation-settings: normal !important; letter-spacing: 0 !important; }

/* encabezado en la bruma */
.hero { background: linear-gradient(180deg, #8EB9B4 0%, #A9CBC6 58%, #C6DCD7 100%); background-image: linear-gradient(180deg, #8EB9B4 0%, #A9CBC6 58%, #C6DCD7 100%); color: var(--ink); position: relative; overflow: hidden; }

<script>
// ───────── Ayudantes de movimiento (no dependen del estado de la página) ─────────
const RM = (() => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } })();
const MOTION = { pending: [], obs: null, charts: 0 };

// Tramas de líneas para las gráficas ("relleno dibujado a mano")
const _patCache = {};
function hatch(color, opts = {}) {

  g.beginPath(); g.moveTo(-2, s + 2); g.lineTo(s + 2, -2); g.moveTo(-2, 2); g.lineTo(2, -2); g.moveTo(s - 2, s + 2); g.lineTo(s + 2, s - 2); g.stroke();
  const p = document.createElement("canvas").getContext("2d").createPattern(c, "repeat"); _patCache[key] = p; return p;
}
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; }

// Animaciones de Chart.js: barras que suben en orden, líneas que se trazan
function animBars(o, stagger = 70) {

  o.animation = { duration: ctx => ctx.mode === "default" ? 900 : 0, easing: "easeOutQuart", delay: ctx => ctx.type === "data" && ctx.mode === "default" ? ctx.dataIndex * stagger + ctx.datasetIndex * 40 : 0 };
  return o;
}
function animTrace(o, perPoint = 55) {

  const prevY = ctx => { if (ctx.type !== "data") return undefined; if (!ctx.index) return ctx.chart.scales.y.getPixelForValue(0);
    const prev = ctx.chart.getDatasetMeta(ctx.datasetIndex).data[ctx.index - 1]; return prev ? prev.getProps(["y"], true).y : undefined; };
  const dur = ctx => ctx.mode === "default" ? perPoint : 0;

    y: { type: "number", easing: "linear", duration: dur, from: ctx => ctx.mode === "default" ? prevY(ctx) : undefined, delay(ctx) { if (ctx.type !== "data" || ctx.yStarted || ctx.mode !== "default") return 0; ctx.yStarted = true; return ctx.index * perPoint; } } };

// Crea la gráfica cuando su tarjeta entra en pantalla (o de inmediato si no hay animación)
function lazyChart(el, create, animated) {

  const ob = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) { ob.disconnect(); const i = MOTION.pending.indexOf(ob); if (i >= 0) MOTION.pending.splice(i, 1); create(); } }); }, { rootMargin: "0px 0px -8% 0px", threshold: 0.2 });

}
function cancelPending() { MOTION.pending.forEach(o => { try { o.disconnect(); } catch (e) {} }); MOTION.pending = []; if (MOTION.obs) { MOTION.obs.disconnect(); MOTION.obs = null; } }

// Números que cuentan hasta su valor (solo el primer texto del elemento)
function countUp(el, dur = 1100) {
  const node = [...el.childNodes].find(n => n.nodeType === 3 && /\d/.test(n.textContent)); if (!node) return;
  const m = node.textContent.match(/^(\D*?)(−|-)?([\d.,]+)(.*)$/s); if (!m) return;
  const pre = m[1], neg = m[2] ? -1 : 1, raw = m[3].replace(/,/g, ""), suf = m[4];
  const dec = (raw.split(".")[1] || "").length, target = parseFloat(raw); if (!isFinite(target)) return;
  const t0 = performance.now(), ease = t => 1 - Math.pow(1 - t, 3);

  const step = now => { const t = Math.min(1, (now - t0) / dur), v = target * ease(t);
    node.textContent = pre + (neg < 0 ? "−" : "") + v.toLocaleString("es-MX", { minimumFractionDigits: dec, maximumFractionDigits: dec }) + suf;
    if (t < 1) requestAnimationFrame(step); else node.textContent = m[0]; };

}
// Pasa después de cada render: marca tarjetas para aparecer, escalona listas, cuenta números
function motionPass(root, animated) {
  document.documentElement.classList.toggle("noanim", !animated || RM);
  const cards = root.querySelectorAll(".card, .sec, .empty");
  cards.forEach(c => c.classList.add("reveal"));
  root.querySelectorAll(".inv-item, .todo").forEach((el, i) => el.style.setProperty("--i", Math.min(i % 14, 12)));
  root.querySelectorAll(".costrow .bar > span").forEach((el, i) => el.style.setProperty("--i", i));
  if (!animated || RM) { cards.forEach(c => c.classList.add("in")); return; }
  const counted = new WeakSet();
  const count = c => c.querySelectorAll(".big, .mid, .equals .v, .costrow .v").forEach(el => { if (!counted.has(el)) { counted.add(el); countUp(el); } });
  if ("IntersectionObserver" in window) {
    MOTION.obs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); count(e.target); MOTION.obs.unobserve(e.target); } }), { rootMargin: "0px 0px -6% 0px", threshold: 0.12 });
    cards.forEach(c => MOTION.obs.observe(c));
  } else cards.forEach(c => { c.classList.add("in"); count(c); });
  document.querySelectorAll(".hero .sum .v").forEach(el => setTimeout(() => countUp(el, 900), 700));

// Medidor de salud (semicírculo con aguja)
function gaugeSVG(r, estado) {
  const cx = 75, cy = 78, R = 62, ang = v => -90 + Math.max(0, Math.min(1.3, v)) / 1.3 * 180;
  const arc = (a0, a1, col, w = 12) => { const p = a => [cx + R * Math.cos((a - 90) * Math.PI / 180), cy + R * Math.sin((a - 90) * Math.PI / 180)]; const [x0, y0] = p(a0), [x1, y1] = p(a1);
    return `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="butt"/>`; };
  const wait = estado === "wait", col = { ok: "#4F8A35", mid: "#D9932B", bad: "#C2453A", wait: "#9AA6A3" }[estado];
  const segs = wait ? arc(-90, 90, "#D8DFDC") : arc(-90, ang(0.85), "#E7B3AE") + arc(ang(0.85), ang(1), "#F1D3A0") + arc(ang(1), 90, "#BFD9B4");
  const ticks = [0, .5, .85, 1, 1.3].map(v => { const a = (ang(v) - 90) * Math.PI / 180; return `<line class="tick" x1="${(cx + (R - 6) * Math.cos(a)).toFixed(1)}" y1="${(cy + (R - 6) * Math.sin(a)).toFixed(1)}" x2="${(cx + (R + 6) * Math.cos(a)).toFixed(1)}" y2="${(cy + (R + 6) * Math.sin(a)).toFixed(1)}" stroke-width="2"/>`; }).join("");
  const a = wait ? -90 : ang(r);
  return `<svg class="gauge" viewBox="0 0 150 86" aria-hidden="true" style="--ang:${a}deg">${segs}${ticks}
    <text x="${cx}" y="58" text-anchor="middle" font-size="13" font-weight="800" fill="${col}" font-family="inherit">${wait ? "" : Math.round(r * 100) + "%"}</text>
    <text x="14" y="84" font-size="8" fill="#85908C" font-family="inherit">0</text><text x="${cx}" y="9" text-anchor="middle" font-size="8" fill="#85908C" font-family="inherit">mínimo</text><text x="136" y="84" text-anchor="end" font-size="8" fill="#85908C" font-family="inherit">+30%</text>
    ${wait ? "" : `<circle class="glow" cx="${cx}" cy="${cy}" r="9" fill="${col}" opacity=".4"/>`}
    <g class="aguja"><line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - R - 2}" stroke="${col}" stroke-width="3.5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="5.5" fill="${col}"/><circle cx="${cx}" cy="${cy}" r="2.2" fill="#fff"/></g></svg>`;
}
// Mini gráfica de los últimos días
function sparkSVG(vals, metas) {
  const W = 220, H = 44, n = vals.length; if (n < 2) return "";
  const mx = Math.max(...vals, ...metas, 1), X = i => (i / (n - 1)) * (W - 8) + 4, Y = v => H - 4 - (v / mx) * (H - 10);
  const pts = vals.map((v, i) => [X(i), Y(v)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const len = pts.reduce((s, p, i) => i ? s + Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]) : 0, 0);
  const dots = pts.map((p, i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${vals[i] >= metas[i] ? "#4F8A35" : "#C2453A"}" style="transition-delay:${1.3 + i * 0.05}s"/>`).join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true" style="--len:${len.toFixed(0)}"><path class="a" d="${d} L${X(n - 1).toFixed(1)} ${H} L4 ${H} Z"/><path class="l" d="${d}"/>${dots}</svg>`;
}
// Olas del encabezado
function olasSVG() {
  const w = (y, amp, col) => { let d = `M0 ${y}`; for (let x = 0; x <= 2400; x += 120) d += ` q 30 ${-amp} 60 0 t 60 0`; return `<path d="${d} L2400 60 L0 60 Z" fill="${col}"/>`; };

// Confeti al cumplir la meta
function avisoM(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 4000); }
function celebrar(titulo, sub) {
  if (RM) { avisoM(titulo); return; }
  const cv = document.createElement("canvas"); cv.className = "confeti"; document.body.appendChild(cv);
  const g = cv.getContext("2d"), dpr = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; g.scale(dpr, dpr);
  const cols = ["#D0663A", "#CFE08A", "#E9A4BD", "#F2D77C", "#8FB5EA", "#4F8A35"], N = 140;
  const P = Array.from({ length: N }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .3, vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 4, r: Math.random() * 6 + 4, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * Math.PI, s: (Math.random() - .5) * .3 }));
  const card = document.createElement("div"); card.className = "festejo"; card.innerHTML = `<b>${titulo}</b><span>${sub}</span>`; document.body.appendChild(card);
  let t = 0; const tick = () => { t++; g.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.a += p.s; g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.globalAlpha = Math.max(0, 1 - t / 150); g.fillRect(-p.r / 2, -p.r / 3, p.r, p.r * .66); g.restore(); });

  requestAnimationFrame(tick); setTimeout(() => card.remove(), 3800);
}

// ───────── Mapa de la zona (vector, con zoom y arrastre) y galería del local ─────────
const MAPA = { cx: 0, cy: 0, w: 4200, sel: null, drag: null, pinch: null };
function mapaProy() {

}

  const ermita = [by("Las Quesabirrias"), by("Birria Los Panchitos"), by("Birria El Hidalguense")].filter(Boolean).map(pt);
  const torres = by("Birria Las Güeras") ? [[P.x(by("Birria Las Güeras").lng) - 2500, P.y(by("Birria Las Güeras").lat) + 40], [P.x(by("Birria Las Güeras").lng) + 2500, P.y(by("Birria Las Güeras").lat) - 40]] : [];

// Motor del modelo financiero (misma lógica que el Excel maestro).
function computeModel(cfg, opts) {
  opts = opts || {};
  const P = Object.assign({}, cfg.params, opts.params || {});
  const esc = opts.escenario || P.Escenario_activo || "Base";
  // derivados
  P.Horas_dia = P.Hora_cierre - P.Hora_apertura;
  P.Asientos = P.Sillas + P.Bancos_barra;
  P.Semanas_por_mes = P.Dias_por_mes / 7;
  P.Dias_operativos_mes = P.Dias_por_mes * P.Dias_semana_abiertos / 7;
  P.Litros_por_llenado = P.Capacidad_tanque * P.Llenado_max;
  const SPM = P.Semanas_por_mes, DOM = P.Dias_operativos_mes;

  // insumos
  const ins = cfg.insumos.map(i => Object.assign({}, i, (opts.insumos || {})[i.key] || {}));
  ins.forEach(i => { i.pu = i.contenido ? i.precio / i.contenido : 0; });
  const byKey = k => ins.find(i => i.key === k);
  P.Precio_birria_kg = byKey("birria").pu;
  P.Precio_bistec_kg = byKey("bistec").pu;
  P.Precio_longaniza_kg = byKey("longaniza").pu;
  P.Precio_pollo_kg = byKey("pollo").pu;
  P.Precio_tortilla_kg = byKey("tortilla").pu;
  P.Precio_queso_kg = byKey("queso").pu;
  P.Precio_refresco_pza = byKey("refresco").pu;
  const planBirria = byKey("birria").planSem || 0;
  const sumPlan = entra => ins.filter(i => i.entra === entra).reduce((s, i) => s + i.pu * (i.planSem || 0), 0);
  P.Adobo_por_kg = planBirria ? sumPlan("Adobo por kg de carne") / planBirria : 0;
  P.Semifijos_cocina_sem = sumPlan("Gasto semi-fijo");

  const names = Object.keys(P).filter(k => typeof P[k] === "number");
  const ev = x => {
    if (typeof x === "number") return x;
    if (x === null || x === undefined || x === "") return 0;
    try { return Function(...names, "return (" + x + ");")(...names.map(n => P[n])); } catch (e) { return 0; }
  };

  const prot = {
    Birria: (P.Precio_birria_kg + P.Adobo_por_kg) / P.Rend_birria / 1000,
    Bistec: P.Precio_bistec_kg / P.Rend_bistec / 1000,
    Longaniza: P.Precio_longaniza_kg / P.Rend_longaniza / 1000,
    Pollo: P.Precio_pollo_kg / P.Rend_pollo / 1000,
    Ninguna: 0,
  };
  const menuSrc = cfg.menu.map((m, i) => Object.assign({}, m, (opts.menu || {})[i] || {}));
  const menu = menuSrc.map(m => {
    const g = ev(m.gramos), tor = ev(m.tortillas), qs = ev(m.queso), gu = ev(m.guarn), ot = ev(m.otros);
    const cCarne = g * (prot[m.proteina] || 0);
    const cTor = tor * P.Peso_tortilla_kg * P.Precio_tortilla_kg;
    const cQue = qs / 1000 * P.Precio_queso_kg;
    const costo = cCarne + cTor + cQue + gu + ot;
    const fc = m.precio ? costo / m.precio : 0;
    const sug = Math.ceil(costo / P.FoodCost_objetivo - 1e-9);
    const sem = m.producto === "Refresco" ? "reventa" : fc <= 0.35 ? "sano" : fc <= 0.45 ? "revisar" : "alto";
    return Object.assign({}, m, { g, tor, qs, gu, ot, cCarne, cTor, cQue, costo, fc, margen: m.precio - costo, sugerido: sug, semaforo: sem });
  });
  const S = menu.reduce((s, m) => s + m.precio * m.mezcla, 0);
  const T = menu.reduce((s, m) => s + m.costo * m.mezcla, 0);
  const ticket = S / 100, fcPond = S ? T / S : 0;
  const gramsProt = p => menu.filter(m => m.proteina === p).reduce((s, m) => s + m.g * m.mezcla, 0);
  const kgBirriaCli = gramsProt("Birria") / 100 / 1000 / P.Rend_birria;
  const kgBistecCli = gramsProt("Bistec") / 100 / 1000 / P.Rend_bistec;
  const kgLongCli = gramsProt("Longaniza") / 100 / 1000 / P.Rend_longaniza;
  const kgPolloCli = gramsProt("Pollo") / 100 / 1000 / P.Rend_pollo;
  const kgTortCli = menu.reduce((s, m) => s + m.tor * m.mezcla, 0) / 100 * P.Peso_tortilla_kg;
  const kgQuesoCli = menu.reduce((s, m) => s + m.qs * m.mezcla, 0) / 100 / 1000;
  const refCli = menu.filter(m => m.producto === "Refresco").reduce((s, m) => s + m.mezcla, 0) / 100;
  const sumCat = c => menu.filter(m => m.cat === c).reduce((s, m) => s + m.mezcla, 0);
  const platos = menu.filter(m => m.cat === "Platos" && m.proteina === "Birria").reduce((s, m) => s + m.mezcla, 0);
  const tacosCli = (sumCat("Tacos") + sumCat("Especialidad") + 2 * platos) / 100;

  const escs = cfg.escenarios.map(e => Object.assign({}, e, { semana: e.lv * 5 + e.sab + e.dom }));
  const act = escs.find(e => e.nombre === esc) || escs[1];
  const cliSem = act.semana;

  // necesidad semanal de insumos según modelo

    { concepto: "Primera compra de insumos, refrescos y desechables", monto: compraArranque },

  const co = [

    { concepto: "Internet", mes: P.Internet_mes },
    { concepto: "Luz", mes: P.Luz_mes },
    { concepto: "Agua (servicio)", mes: P.Agua_servicio },
    { concepto: "Gas LP", mes: P.Consumo_gas_dia * P.Precio_gas_litro * DOM },
    { concepto: "Agua purificada", mes: P.Garrafones_dia * P.Precio_garrafon * DOM },
    { concepto: "Limpieza y consumibles", mes: P.Limpieza_semana * SPM },
    { concepto: "Papa y frijol (semi-fijo)", mes: P.Semifijos_cocina_sem * SPM },
    { concepto: "Mantenimiento e imprevistos", mes: P.Mantenimiento_mes },
    { concepto: "Contador / trámites", mes: P.Contador_mes },
  ];
  const gastosOp = co.reduce((s, x) => s + x.mes, 0);
  const sueldos = P.Personas_sin_sueldo * P.Salario_minimo_diario * P.Factor_jornada * P.Dias_por_mes +

  // equilibrio

  const eq = [
    lvl("Cubrir gastos de operación (sin sueldos)", gastosOp),
    lvl("+ salario mínimo de Miguel y su esposa", gastosTot),
    lvl("+ pagos de créditos (meses 1–3)", gastosTot + credMes),
    lvl("+ recuperar la inversión en " + P.Meses_recuperar + " meses", gastosTot + invTotal / P.Meses_recuperar),

  // salida semanal
  const ventaSem = cliSem * ticket;
  const sem = {
    insumos: ventaSem * fcPond,
    desech: cliSem * (P.Desechable_cliente + P.Pct_para_llevar * P.Empaque_llevar),
    operacion: (gastosOp - P.Renta_mensual - P.Internet_mes - P.Luz_mes - P.Agua_servicio - P.Contador_mes) / SPM,
    fijos: (P.Renta_mensual + P.Internet_mes + P.Luz_mes + P.Agua_servicio + P.Contador_mes) / SPM,
    impuestos: ventaSem * (P.Impuestos_pct + P.Pct_tarjeta * P.Comision_tarjeta),

  sem.sinSueldos = sem.insumos + sem.desech + sem.operacion + sem.fijos + sem.impuestos;

function salud() {
  const { v, ap } = real(), t = today(), sm = semanaMinima(0), e = M.esc;
  if (parseD(t) < parseD(ap) || !v.length) return null;
  const wk = weekNo(t, ap), ini = isoLocal(new Date(parseD(ap).getTime() + (wk - 1) * 7 * 864e5));

function cRegistro() {

const STATIC = { horas: DEFAULT_CONFIG.horas, perfilLV: DEFAULT_CONFIG.perfilLV, perfilFS: DEFAULT_CONFIG.perfilFS, competencia: DEFAULT_CONFIG.competencia, apps: DEFAULT_CONFIG.apps, pop: DEFAULT_CONFIG.pop };
let pendingRender = false, lastLoad = null;
const typing = () => { const a = document.activeElement; return !!(a && a.matches && a.matches("input:not([type=range]):not([type=checkbox]),textarea")); };
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender && !typing()) { pendingRender = false; rerender(); } }, 0));
function aplicar(d) {
  S.cfg = Object.assign({}, STATIC, d.config); S.ventas = d.ventas || []; S.pend = d.pendientes || []; S.hist = d.historial || [];
  S.fromDb = true; S.dbState = "ok"; S.canEdit = true; S.canWrite = true; lastLoad = new Date();
  if (typing()) pendingRender = true; else rerender();
}
async function cargar() {
  if (!API_URL) { S.dbState = "sinurl"; rerender(); return; }
  try { const r = await fetch(API_URL + (API_URL.includes("?") ? "&" : "?") + "t=" + Date.now(), { redirect: "follow" }); const j = await r.json(); if (!j.ok) throw new Error(j.error || "error"); aplicar(j.datos); }
  catch (e) { if (S.dbState !== "ok") { S.dbState = "sin"; rerender(); } }
}
function leerPin() { try { return localStorage.getItem("jalisciense-pin") || ""; } catch (e) { return S._pin || ""; } }
function guardarPin(p) { S._pin = p; try { p ? localStorage.setItem("jalisciense-pin", p) : localStorage.removeItem("jalisciense-pin"); } catch (e) {} }
function pedirPin(msg) {
  return new Promise(res => {
    const box = document.createElement("div"); box.className = "pinbox";
    box.innerHTML = `<form class="pincard" role="dialog" aria-label="PIN"><h3>Escribe el PIN</h3><p class="sub">${msg || "Para guardar cambios en la hoja. Se recordará en este teléfono."}</p>
      <input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="PIN"><div class="row" style="margin-top:12px"><button class="btn" type="submit">Continuar</button><button class="btn sec" type="button" id="pinNo">Cancelar</button></div></form>`;
    document.body.appendChild(box); const inp = box.querySelector("#pinIn"); inp.focus();
    const fin = v => { box.remove(); res(v); };
    box.querySelector("form").addEventListener("submit", e => { e.preventDefault(); fin(inp.value.trim()); });
    box.querySelector("#pinNo").onclick = () => fin("");
  });
}
async function api(action, payload) {
  if (!API_URL) throw { code: "sinurl" };
  let pin = leerPin(); if (!pin) pin = await pedirPin(); if (!pin) throw { code: "cancel" };
  let r; try { r = await fetch(API_URL, { method: "POST", redirect: "follow", body: JSON.stringify(Object.assign({ pin, action }, payload)) }); } catch (e) { throw { code: "red" }; }
  let j; try { j = await r.json(); } catch (e) { throw { code: "red" }; }
  if (!j.ok && j.error === "pin") { guardarPin(""); const otro = await pedirPin("Ese PIN no es correcto. Intenta otra vez."); if (!otro) throw { code: "cancel" }; guardarPin(otro); return api(action, payload); }
  if (!j.ok) throw { code: "srv", msg: j.error };
  guardarPin(pin); aplicar(j.datos); aviso("Guardado en la hoja"); return j;
}
function errTxt(e) { return !e ? "No se pudo guardar." : e.code === "cancel" ? "No se guardó (falta el PIN)." : e.code === "red" ? "Sin conexión. Revisa el internet e intenta de nuevo." : e.code === "sinurl" ? "Falta conectar la hoja de Google." : "No se pudo guardar: " + (e.msg || "error"); }
function aviso(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 4000); }
cargar();
setInterval(() => { if (document.visibilityState === "visible" && !typing()) cargar(); }, 120000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && (!lastLoad || Date.now() - lastLoad > 60000)) cargar(); });
</script>
